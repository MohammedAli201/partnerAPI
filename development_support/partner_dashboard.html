<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JubaTech test payouts</title><link rel="stylesheet" href="/static/admin.css">
<style>body{font:16px system-ui;background:#f4f7fa;color:#152b39;margin:0}.wrap{max-width:1280px;margin:auto;padding:32px}.panel{background:white;padding:24px;border-radius:12px;margin:20px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #ddd}small{display:block;overflow-wrap:anywhere}button,input,select{font:inherit;padding:8px;max-width:100%}#message{white-space:pre-wrap}a{color:#006d77}</style></head>
<body><main class="wrap"><a href="/admin">Back to partner dashboard</a>
<h1>JubaTech test payouts</h1><p>Accepted payouts wait here for a terminal test result. The backend updates after the signed callback is verified.</p>
<p id="message" role="status"></p><button id="refresh">Refresh</button>
<section class="panel"><div style="overflow:auto"><table><thead><tr><th>Transaction / partner reference</th><th>Wallet</th><th>Amount</th><th>Status</th><th>Terminal test result</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><script>
const rows=document.getElementById('rows'),message=document.getElementById('message');
async function load(){const response=await fetch('/admin/api/development-payouts');if(!response.ok)throw Error('Sign in with an active partner administrator account.');const data=await response.json();rows.replaceChildren();for(const payout of data.payouts){const row=document.createElement('tr');for(const text of [payout.transactionId+'\n'+payout.id,payout.provider+' '+payout.recipient,payout.amount+' '+payout.currency,payout.status]){const cell=document.createElement('td');cell.style.whiteSpace='pre-wrap';cell.textContent=text;row.append(cell);}const cell=document.createElement('td');if(['RECEIVED','PROCESSING'].includes(payout.status)){const form=document.createElement('form'),select=document.createElement('select'),reason=document.createElement('input'),button=document.createElement('button');select.setAttribute('aria-label','Terminal result');for(const [value,label] of [['SENT','Simulate Paid'],['FAILED','Simulate Failed'],['REJECTED','Simulate Rejected']]){const option=document.createElement('option');option.value=value;option.textContent=label;select.append(option);}reason.placeholder='Reason for test result';reason.setAttribute('aria-label','Reason for test result');reason.required=true;reason.maxLength=500;button.textContent='Send test result';form.append(select,reason,button);form.onsubmit=async event=>{event.preventDefault();button.disabled=true;try{const result=await fetch('/admin/api/development-payouts/'+encodeURIComponent(payout.id)+'/terminal',{method:'POST',headers:{'Content-Type':'application/json','X-Simulator-Action':'terminal'},body:JSON.stringify({status:select.value,reason:reason.value})});if(!result.ok){const error=await result.json();throw Error(error.detail||'Test result failed');}message.textContent='Terminal test result recorded; signed callback queued for the backend.';await load();}catch(error){message.textContent=error.message;button.disabled=false;}};cell.append(form);}else cell.textContent='Terminal result recorded';row.append(cell);rows.append(row);}}
document.getElementById('refresh').onclick=()=>load().catch(error=>message.textContent=error.message);load().catch(error=>message.textContent=error.message);
</script></body></html>
