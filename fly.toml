# fly.toml app configuration file generated for partnercodeapi on 2026-02-02T18:35:30+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'partnercodeapi'
primary_region = 'fra'

[build]

[processes]
  app = "uvicorn main:app --host 0.0.0.0 --port 8080 --workers 2"
  callbacks = "python -m payment_processes callbacks"
  reaper = "python -m payment_processes reaper"

[env]
  ENVIRONMENT = "production"
  SKIP_DB_BOOTSTRAP = "true"
  COOKIE_SECURE = "true"
  EMBEDDED_PAYMENT_WORKERS = "false"
  POOL_SIZE = "8"
  MAX_OVERFLOW = "4"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
