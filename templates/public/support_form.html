<form class="enquiry-form" id="support-enquiry" data-draft="support" novalidate><span class="sample-tag">{{ copy.draft_label }}</span>
<div class="form-grid">{% for name,label,type in [('name','name','text'),('email','support_email','email')] %}<div class="form-field"><label for="support-{{ name }}">{{ copy[label] }}</label><input type="{{ type }}" name="{{ name }}" id="support-{{ name }}" required minlength="{{ 5 if name=='email' else 2 }}" maxlength="{{ 254 if name=='email' else 100 }}" autocomplete="{{ name }}" aria-describedby="support-{{ name }}-error"><span class="field-error" id="support-{{ name }}-error"></span></div>{% endfor %}</div>
<div class="form-field"><label for="support-topic">{{ copy.support_topic }}</label><select id="support-topic" name="topic">{% for value,key in [('delivery','topic_delivery'),('details','topic_details'),('other','topic_other')] %}<option value="{{ value }}">{{ copy[key] }}</option>{% endfor %}</select><span class="field-error" id="support-topic-error"></span></div>
<div class="form-field"><label for="support-message">{{ copy.support_message }}</label><textarea name="message" id="support-message" rows="4" required minlength="10" maxlength="2000" aria-describedby="support-message-error support-note"></textarea><span class="field-error" id="support-message-error"></span><p class="small-note" id="support-note">{{ copy.safe_message }}</p></div>
<button type="submit" class="button button-full">{{ copy.review_enquiry }}</button><p class="form-status" role="status" aria-live="polite"></p></form>
{% include 'public/draft_dialog.html' %}
